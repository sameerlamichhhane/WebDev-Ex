<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division layout</title>
</head>
<body>
  <main>
    <p>Resize the browser window to see these divisions move from two columns into one.</p>
    <h2>Content</h2>
    <p>This division contains the main text. Its width changes with the viewport.</p>
    <h2>Aside</h2>
    <p>This division contains supporting information and stacks below the content on a small screen.</p>
  </main>
</body>
</html>
